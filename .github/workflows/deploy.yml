name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env
          echo "VITE_BROWSER_HISTORY=${{ secrets.VITE_BROWSER_HISTORY }}" >> .env

      - name: Build and deploy
        run: |
          docker compose -f docker-compose.prod.yml -d --build

      - name: Clean up old images
        run: docker image prune -f